[package]
name = "pirate-encoder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pirate-encoder"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
glob = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
indicatif = "0.17"
chardetng = "0.1"
encoding_rs = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
